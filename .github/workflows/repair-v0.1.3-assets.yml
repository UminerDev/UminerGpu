name: Repair v0.1.3 release assets

on:
  push:
    branches:
      - main
    paths:
      - "dist/uminer-linux-x86_64-cuda13.tar.gz"
      - "dist/SHA256SUMS"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrected assets
        uses: actions/checkout@v4

      - name: Verify corrected archive
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Replace v0.1.3 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.3 \
            dist/uminer-linux-x86_64-cuda13.tar.gz \
            dist/SHA256SUMS \
            --clobber
