name: publish-binary-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: verify tracked release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -s "release-notes/${GITHUB_REF_NAME}.md"
          test -s "dist/uminer-${version}-linux-x86_64.tar.gz"
          test -s "dist/uminer-${version}-linux-x86_64.tar.gz.sig"
          test -s dist/uminer-linux-x86_64.tar.gz
          test -s dist/uminer-linux-x86_64-cuda13.tar.gz
          test -s dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/uminer-${version}-linux-x86_64.tar.gz" \
            "dist/uminer-${version}-linux-x86_64.tar.gz.sig" \
            dist/uminer-linux-x86_64.tar.gz \
            dist/uminer-linux-x86_64-cuda13.tar.gz \
            dist/PROVENANCE.intoto.json \
            dist/PROVENANCE.intoto.json.sig \
            dist/RELEASE-PUBLIC-KEY.pem \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Uminer GPU ${GITHUB_REF_NAME} (Testing Release)" \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md" \
            --latest
