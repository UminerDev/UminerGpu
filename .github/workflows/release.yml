name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release metadata
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify assets
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/uminer-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" \
            "dist/uminer-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz.sig" \
            dist/uminer-linux-x86_64.tar.gz \
            dist/uminer-linux-x86_64-cuda13.tar.gz \
            dist/PROVENANCE.intoto.json \
            dist/PROVENANCE.intoto.json.sig \
            dist/RELEASE-PUBLIC-KEY.pem \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Uminer GPU ${GITHUB_REF_NAME} (Testing Release)" \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md" \
            --latest
